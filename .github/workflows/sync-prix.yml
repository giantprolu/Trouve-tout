name: Synchronisation des prix ManoMano

on:
  schedule:
    # GitHub Actions raisonne en UTC (pas de fuseau horaire natif) : 6h UTC
    # correspond à 8h heure de Paris en été (UTC+2), 7h en hiver.
    #
    # Une seule exécution par jour depuis le 2026-08-04 : l'annonceur a
    # remplacé ses deux flux d'origine par une trentaine de partitions d'un
    # million de lignes, entre lesquelles les 118 fiches sont éparpillées. Un
    # run complet lit donc plusieurs dizaines de millions de lignes et dure
    # bien plus longtemps qu'avant — inutile de payer ça deux fois par jour
    # pour un catalogue dont les prix bougent au mieux quotidiennement.
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: node scripts/sync-prix.mjs
        env:
          AWIN_FEED_URL: ${{ secrets.AWIN_FEED_URL }}
          # Facultatif mais fortement recommandé : donne accès à la liste des
          # flux Awin et donc à leur date réelle de dernière mise à jour, la
          # seule datation officielle. Clé distincte de la Publisher API,
          # à récupérer dans Awin > Toolbox > Create-a-Feed.
          AWIN_DATAFEED_API_KEY: ${{ secrets.AWIN_DATAFEED_API_KEY }}

      # Depuis que `syncedAt` porte la date de génération du flux et non celle
      # du run, ce test fait enfin ce que son nom dit : tant qu'Awin ne
      # régénère pas son export, le fichier est identique au précédent et rien
      # n'est poussé. Avant, les 118 `syncedAt` changeaient à chaque exécution
      # et déclenchaient deux redéploiements Vercel par jour pour rien.
      - name: Commit et push si le flux a changé
        run: |
          if git diff --quiet -- src/data/prix-synchronises.json; then
            echo "Flux inchangé depuis la dernière synchronisation — rien à pousser."
            exit 0
          fi
          git config user.name "trouve-tout-bot"
          git config user.email "actions@github.com"
          git add src/data/prix-synchronises.json
          git commit -m "chore: sync prix ManoMano"
          git push origin HEAD:main
